<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Todo App{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 0 auto; padding: 0 16px; background: #f6f7fb; color: #222; }
    nav { background: #2d3e50; padding: 12px 16px; margin: 0 -16px 24px; }
    nav a { color: #fff; text-decoration: none; margin-right: 16px; font-weight: bold; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .done { color: #1e8e3e; font-weight: bold; }
    .pending { color: #c5221f; font-weight: bold; }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; font-size: 14px; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-light { background: #e8eaed; color: #222; }
    .errorlist { color: #d93025; margin: 4px 0; padding-left: 18px; }
    label { font-weight: bold; display: block; margin-top: 12px; }
    input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'tasks:task_list' %}">All Tasks</a>
    <a href="{% url 'tasks:task_create' %}">+ New Task</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
