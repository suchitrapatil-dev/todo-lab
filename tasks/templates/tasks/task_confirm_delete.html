{% extends "tasks/base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}
  <div class="card">
    <h1>Delete task?</h1>
    <p>Are you sure you want to delete <strong>"{{ task.title }}"</strong> (Task #{{ task.pk }})?</p>
    <p>This cannot be undone.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Delete</button>
      <a class="btn btn-light" href="{% url 'tasks:task_detail' task.pk %}">Cancel</a>
    </form>
  </div>
{% endblock %}
